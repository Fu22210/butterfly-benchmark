const $ = id => document.getElementById(id);
const rows = JSON.parse($("rows").textContent);
const labels = {practice_reference:"Тренировочный пример",visually_corrected:"Исправлено по изображению",model_draft:"Черновик модели"};
let chosen = [], current = 0, original = false;
function render(){
  const q=$("query").value.trim().toLowerCase(), status=$("status").value, boxes=$("boxes").value;
  chosen=rows.filter(r=>(!status||r.status===status)&&(!boxes||(boxes==="marked")===Boolean(r.count))&&
    (String(r.id).includes(q)||(r.source||"").toLowerCase().includes(q)));
  $("count").textContent=chosen.length+" из "+rows.length;
  const cards=chosen.map((r,i)=>{
    const button=document.createElement("button");
    button.type="button";button.className="card";
    const image=new Image();image.src="thumbnails/"+r.id+".jpg";image.loading="lazy";image.alt="";
    const title=document.createElement("strong");title.textContent=r.source||r.id;
    const small=document.createElement("small");small.textContent=r.id+" · рамок "+r.count;
    const tag=document.createElement("small");tag.textContent=labels[r.status];
    button.append(image,title,small,tag);
    button.addEventListener("click",()=>{original=false;select(i);$("detail").showModal();});
    return button;
  });
  $("grid").replaceChildren(...cards);
}
function select(i){
  if(i<0||i>=chosen.length)return;
  const row=chosen[current=i], preview="previews/"+row.id+".jpg";
  $("heading").textContent=row.id+" · "+(row.source||"")+" · "+labels[row.status];
  $("big").src=original?row.photo:preview;$("big").alt=$("heading").textContent;
  $("toggle").textContent=original?"Показать рамки":"Показать оригинал";
  $("toggle").setAttribute("aria-pressed",String(original));
  $("overlay").href=preview;$("prev").disabled=i===0;$("next").disabled=i===chosen.length-1;
}
$("prev").onclick=()=>select(current-1);$("next").onclick=()=>select(current+1);
$("toggle").onclick=()=>{original=!original;select(current);};$("close").onclick=()=>$("detail").close();
$("detail").onkeydown=e=>{if(e.key==="ArrowLeft")select(current-1);if(e.key==="ArrowRight")select(current+1);};
for(const key of ["status","boxes","query"]) $(key).addEventListener("input",render);
render();
</script>
</html>
